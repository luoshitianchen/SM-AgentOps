[project]
name = "SM-AgentOps"
version = "2.0.0"
description = "企业 AI Agent 管理：Agent 注册、Prompt、工具权限、调用审计与成本"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
